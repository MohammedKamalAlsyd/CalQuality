[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MohammedKamalAlsyd", email = "MohammedKamalAlsyd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.78",
    "botocore>=1.43.78",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-aws>=1.7.3",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "openpyxl",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.52.4",
    "voyageai>=0.5.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]
